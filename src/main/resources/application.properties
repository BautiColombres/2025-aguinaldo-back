spring.application.name=MediBook API

# Secrets are kept OUT of this file. Provide them via environment variables
# (spring-dotenv reads a gitignored .env) or via the optional gitignored
# application-secrets.properties (see application-secrets.properties.example).
spring.config.import=optional:classpath:application-secrets.properties

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medibook}
spring.datasource.username=${DB_USERNAME:postgres}
# No committed default: a missing DB_PASSWORD fails fast (secrets file / env only).
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration for Render
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# JWT Configuration
# jwt.secret has NO default: the application fails fast at startup if JWT_SECRET
# is missing or shorter than 32 bytes (see JwtService.validateSecretKey).
# jwt.expiration has NO default either: a missing/empty JWT_DURATION fails fast
# (empty does not bind to long; <= 0 is rejected in JwtService.validateSecretKey).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_DURATION}

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Give database more time to be ready on startup
spring.liquibase.liquibase-schema=public

# Server Configuration
server.port=${PORT:8080}

# Refresh-token cookie (FSEC-H1). The backend issues the refresh token as an
# httpOnly, SameSite cookie scoped to /api/auth.
# - app.cookie.secure: true in prod (https), false in DEV (plain http localhost).
#   Overridden to false via the gitignored .env for local development. Driven by a
#   property (NOT the request scheme) because prod may sit behind a TLS proxy.
# - app.cookie.same-site: Strict by default. Flip to None (with Secure=true) only if
#   a future deploy puts the front and back on different registrable domains.
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Strict}

# CORS (BSEC-M-2): pinned origins for credentialed (cookie) requests. Include the
# Vite dev origin for local development.
# CORS_ALLOWED_ORIGINS default is http://localhost:5173 (see SecurityConfig).

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Admin bootstrap (BSEC-H-4): the admin account is provisioned at startup from
# these env vars by AdminProvisioningRunner. No committed defaults: a missing
# ADMIN_EMAIL/ADMIN_PASSWORD fails fast (refuses to boot). Credentials live in
# the gitignored .env / application-secrets.properties.
admin.bootstrap.email=${ADMIN_EMAIL}
admin.bootstrap.password=${ADMIN_PASSWORD}
admin.bootstrap.dni=${ADMIN_DNI:99999999}

# Email Configuration
email.enabled=${EMAIL_ENABLED:true}

# Google Apps Script Configuration (método de envío de emails)
google.apps.script.url=${GOOGLE_APPS_SCRIPT_URL:}
# No committed default: the token is a secret (gitignored secrets file / env).
google.apps.script.token=${GOOGLE_APPS_SCRIPT_TOKEN}

# Supabase Storage S3 Configuration
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:http://localhost:8000}
supabase.s3.region=${SUPABASE_S3_REGION:us-east-1}
# No committed defaults: S3 credentials are secrets (gitignored secrets file / env).
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY}

# Medical Check API Configuration
# medical.check.api.key has NO default: provided via the gitignored secrets file
# / environment. The application fails fast at startup if it is missing
# (see MedicalCheckApiService.validateConfiguration).
medical.check.api.url=${MEDICAL_CHECK_API_URL:https://api.gymcloud.vschiaffino.com}
medical.check.api.key=${MEDICAL_CHECK_API_KEY}

# GymCloud API Configuration (inbound API keys, comma-separated)
# No committed default: required secret (gitignored secrets file / env).
gymcloud.api.keys=${GYMCLOUD_API_KEYS}