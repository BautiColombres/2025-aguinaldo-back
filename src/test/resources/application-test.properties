# H2 Database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS "JSONB" AS TEXT
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# Disable Liquibase for tests (H2 doesn't support PostgreSQL extensions)
spring.liquibase.enabled=false

# H2 Console (optional - for debugging)
spring.h2.console.enabled=true

# Override PostgreSQL specific types for H2
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Disable emails in test environment to avoid API calls
email.enabled=false

# Google Apps Script test configuration
google.apps.script.url=https://test.example.com/test-endpoint
google.apps.script.token=test-token

# GymCloud API Configuration
gymcloud.api.keys=test-key-1,test-key-2

# Supabase Storage S3 (test stand-ins; application.properties no longer has defaults)
supabase.s3.endpoint=http://localhost:8000
supabase.s3.region=us-east-1
supabase.s3.access-key=test-access-key
supabase.s3.secret-key=test-secret-key

# Admin bootstrap — provided so the fail-fast provisioning runner can
# boot the Spring context under test (application.properties has no defaults).
admin.bootstrap.email=admin-bootstrap@medibook.test
admin.bootstrap.password=test-admin-bootstrap-password
admin.bootstrap.dni=98765432

# Auth rate limiting — high default in the shared test context so the
# per-IP limiter does not interfere with integration tests that share one cached
# Spring context (and one bucket per remote addr). The dedicated
# AuthRateLimitFilterTest overrides these to small values in its own context.
auth.ratelimit.capacity=100000
auth.ratelimit.refill-minutes=1

# JWT Configuration for tests (>= 32 bytes so fail-fast validation passes)
jwt.secret=test-jwt-secret-key-for-testing-purposes-only
jwt.expiration=3600000

# Medical Check API Configuration for tests (no real key; just non-blank so fail-fast passes)
medical.check.api.url=https://test.example.com
medical.check.api.key=test-medical-check-api-key